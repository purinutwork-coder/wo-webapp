<script>
/*
  หน้ารายการใบงานที่ถูกตีกลับ (SPEC 17.2)

  เป็นทางเดียวที่ผู้เปิดใบงานจะรู้ว่ามีใบถูกตีกลับรออยู่ จนกว่าจะมีหน้า Home เต็มรูปแบบ
  และ Telegram · ถ้าไม่มีหน้านี้ ใบที่ถูกตีกลับจะค้างเงียบ ๆ โดยไม่มีใครรู้

  เรียงใบที่ถูกตีกลับนานที่สุดไว้บนสุด (เซิร์ฟเวอร์เรียงมาให้แล้ว) ตั้งใจให้ผิดจากหน้าอื่น
  เพราะใบที่ค้างนานที่สุดคือใบที่เสี่ยงถูกลืมที่สุด
*/

/* คีย์ที่หน้านี้ต้องใช้จากก้อนข้อมูลที่เซิร์ฟเวอร์ส่งมา (SPEC 17.3) */
var PAGE_NEEDS = ['rows'];

var state = { rows: [] };

document.addEventListener('DOMContentLoaded', function () {
  initNav('returned');
  // บอกไว้ว่าถ้าต้องล็อกอินกลางคัน แล้วล็อกอินเสร็จ ให้กลับมาทำอะไรต่อ (SPEC 17.3)
  bootPage(loadPage, loadList);
});

/** เปิดหน้า — ตรวจสิทธิ์ ผูกปุ่ม แล้ววาดรายการรอบแรก */
function loadPage() {
  // ทุกกล่องที่ขึ้นว่ากำลังโหลด ต้องจบลงด้วยอะไรสักอย่างเสมอ (SPEC 17.3)
  var doneLoading = guardLoading('list');

  // ตรวจสิทธิ์ให้ผ่านก่อน แล้วค่อยขอรายการ (SPEC 17.3)
  startPage('list', PAGE_NEEDS).then(function (started) {
    if (!started.allowed) { doneLoading(); return; }

    document.getElementById('btnRefresh').addEventListener('click', loadList);

    // ข้อมูลรอบแรกมากับคำขอเดียวกันแล้ว ไม่ต้องยิงถามซ้ำ (SPEC 17.3)
    apply(started.boot);
    doneLoading();
  });
}

/**
 * รับรายการมาแสดง ใช้ร่วมกันทั้งข้อมูลรอบแรกและที่โหลดใหม่ภายหลัง
 * @param {Object} data ผลจาก api_listReturnedWorkOrders
 */
function apply(data) {
  state.rows = data.rows || [];
  render();
}

/** โหลดรายการใหม่ */
function loadList() {
  setBusy(true);
  callApi('api_listReturnedWorkOrders', [])
    .then(apply)
    .catch(function (error) { showActionError(error, loadList); })
    .then(function () { setBusy(false); });
}

/** วาดรายการทั้งหมด */
function render() {
  var box = document.getElementById('list');

  if (!state.rows.length) {
    // สถานะว่างเป็นเรื่องปกติ ต้องบอกด้วยว่าปกติจะมีข้อมูลเมื่อไร (SPEC 17.3)
    box.innerHTML = emptyHtml('ยังไม่มีใบงานที่ถูกตีกลับ',
      'ใบงานจะขึ้นที่นี่เมื่อผู้อนุมัติหรือแผนกตีกลับมาให้แก้ไข');
    return;
  }

  var html = '<div class="note-box info">มีใบงานรอแก้ไข ' + state.rows.length + ' ใบ · ' +
    'ใบที่ถูกตีกลับนานที่สุดอยู่บนสุด</div>';

  for (var i = 0; i < state.rows.length; i++) html += rowHtml(state.rows[i]);
  box.innerHTML = html;
}

/**
 * การ์ดของใบงานหนึ่งใบ
 * @param {Object} row ข้อมูลจากเซิร์ฟเวอร์
 * @return {string} HTML
 */
function rowHtml(row) {
  var editUrl = NAV.base
    ? (NAV.base + '?page=create&wo=' + encodeURIComponent(row.woId)) : '';

  return '<div class="wo-item">' +
    '<h3>' + escapeHtml(row.woId) + ' · ' + escapeHtml(row.customerName) + '</h3>' +

    '<div class="note-box stop"><b>เหตุผลที่ถูกตีกลับ</b><br>' +
    escapeHtml(row.returnReason || 'ไม่ได้ระบุเหตุผลไว้') + '</div>' +

    '<dl>' +
    '<dt>ตีกลับโดย</dt><dd>' + escapeHtml(row.returnedBy || '-') + '</dd>' +
    '<dt>เมื่อ</dt><dd>' + escapeHtml(row.display.returnedDate) + '</dd>' +
    '<dt>ถูกตีกลับมาแล้ว</dt><dd>' + row.returnCount + ' ครั้ง</dd>' +
    '<dt>สถานที่</dt><dd>' + escapeHtml(row.location || '-') + '</dd>' +
    '<dt>โครงการ</dt><dd>' + escapeHtml(row.project || '-') + '</dd>' +
    '<dt>สายงาน</dt><dd>' + escapeHtml(labelOf('assignment', row.assignmentType)) + '</dd>' +
    '<dt>ลักษณะงาน</dt><dd>' + escapeHtml(row.jobDescription || '-') + '</dd>' +
    '<dt>ผู้แจ้งงาน</dt><dd>' + escapeHtml(row.createdBy || '-') + '</dd>' +
    '<dt>วันที่แจ้ง</dt><dd>' + escapeHtml(row.display.createdDate) + '</dd>' +
    '</dl>' +

    (editUrl
      ? '<div class="actions"><a class="btn-link" href="' + escapeHtml(editUrl) +
        '">แก้ไขแล้วส่งอนุมัติใหม่</a></div>'
      : '') +
    '</div>';
}
</script>
</body>
</html>
