# เครื่องวัดของกองที่ 1 ข้อ 2 — ชั่วคราว ต้องลบทิ้งทันทีที่วัดเสร็จ
#
# ชื่อต้องไม่ชนกับ cnr-rfq ซึ่งเป็น Worker ของคนอื่นในบัญชีเดียวกัน
# ห้ามแตะ ห้ามเขียนทับ ห้ามลบ Worker ตัวนั้นเด็ดขาด
#
# ไม่มีความลับอยู่ในไฟล์นี้เลย — ทุกตัวตั้งด้วย `wrangler secret put`
# ต้องตั้งสองตัวก่อนวัด: PROOF_TOKEN (ด่านของเครื่องวัด) และ SUPABASE_ANON_KEY
# ห้ามใส่ service_role เด็ดขาด (CLAUDE.md ข้อ 22)

name = "wo-probe-fetch"
main = "index.js"
compatibility_date = "2026-09-01"

# ต้องการ AbortSignal.timeout และพฤติกรรมของ fetch ตามมาตรฐานล่าสุด
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
