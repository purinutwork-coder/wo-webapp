# เครื่องวัดของกองที่ 1 ข้อ 2 — ชั่วคราว ต้องลบทิ้งทันทีที่วัดเสร็จ
#
# ชื่อต้องไม่ชนกับ cnr-rfq ซึ่งเป็น Worker ของคนอื่นในบัญชีเดียวกัน
# ห้ามแตะ ห้ามเขียนทับ ห้ามลบ Worker ตัวนั้นเด็ดขาด
#
# ไม่มีความลับอยู่ในไฟล์นี้เลย — ทุกตัวตั้งด้วย `wrangler secret put`
# ต้องตั้งสองตัวก่อนวัด: PROOF_TOKEN (ด่านของเครื่องวัด) และ SUPABASE_ANON_KEY
# ห้ามใส่ service_role เด็ดขาด (CLAUDE.md ข้อ 22)

name = "wo-probe-fetch"
main = "index.js"
compatibility_date = "2026-09-01"

# ต้องการ AbortSignal.timeout และพฤติกรรมของ fetch ตามมาตรฐานล่าสุด
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# เป้าที่ควบคุมได้ของข้อ 3, 5, 6
#
# เดิมเครื่องวัดสร้างสถานการณ์ด้วยการยิง fetch ใส่ตัวเอง ซึ่ง Cloudflare ไม่อนุญาต
# ได้ `404 error code: 1042` ทุกครั้งบนของจริง (วัดเจอ 01-10-2026)
# `wrangler dev` ในเครื่องยอมให้ทำ ข้อห้ามนี้จึงมองไม่เห็นจนกว่าจะ deploy
#
# Durable Object เรียกผ่าน stub เป็นการเรียกภายใน ไม่ใช่คำขอ HTTP ที่วิ่งออกไปหา
# zone เดิม · และตัวนับของข้อ 5 อยู่ใน object เดียวที่เรียกด้วยชื่อคงที่
# ทุกคำขอจึงไปถึงตัวเดียวกันแน่นอน ปัญหา "คนละ isolate" หายไปจริง
[[durable_objects.bindings]]
name = "PROBE"
class_name = "ProbeTarget"

# ต้องเป็น new_sqlite_classes ไม่ใช่ new_classes เพราะแผนฟรีรองรับเฉพาะแบบ SQLite
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProbeTarget"]
